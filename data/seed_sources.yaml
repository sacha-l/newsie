# Curated DE/Berlin sources. Spectrum is one value from a fixed set.
# spectrum_basis is the reason for that placement and is shown to the reader.
# Feed URLs were not re-checked on 16 Nov 2026. Run `newsie validate-sources`
# before treating a new feed as healthy. Paywalled outlets may store partial text.
sources:
  - id: tagesschau
    name: Tagesschau
    homepage_url: https://www.tagesschau.de
    feed_url: https://www.tagesschau.de/index~rss2.xml
    adapter: rss
    tier: reporting
    spectrum: centre
    spectrum_basis: Public-broadcaster news desk. Placement is an editorial judgement, open to dispute.
    publisher_group: ard
